<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400" role="img" aria-label="ESP32-C3 WebUI">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a0a0f"/>
      <stop offset="1" stop-color="#1b1646"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4f46e5"/>
      <stop offset="1" stop-color="#10b981"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="400" fill="url(#bg)"/>

  <!-- circuit traces -->
  <g stroke="#4f46e5" stroke-opacity="0.35" stroke-width="2" fill="none">
    <path d="M0 80 H220 L260 120 H420"/>
    <path d="M0 320 H180 L220 280 H420"/>
    <path d="M1200 90 H980 L940 130 H800"/>
    <path d="M1200 310 H1020 L980 270 H800"/>
  </g>
  <g fill="#10b981" fill-opacity="0.6">
    <circle cx="420" cy="120" r="5"/><circle cx="420" cy="280" r="5"/>
    <circle cx="800" cy="130" r="5"/><circle cx="800" cy="270" r="5"/>
  </g>

  <!-- chip -->
  <g transform="translate(540 120)">
    <g stroke="#94a3b8" stroke-width="4" stroke-linecap="round">
      <path d="M30 -14V10M70 -14V10M110 -14V10M150 -14V10"/>
      <path d="M30 150V174M70 150V174M110 150V174M150 150V174"/>
      <path d="M-14 30H10M-14 70H10M-14 110H10"/>
      <path d="M170 30H194M170 70H194M170 110H194"/>
    </g>
    <rect x="10" y="10" width="160" height="140" rx="18" fill="#16161e" stroke="url(#accent)" stroke-width="4"/>
    <!-- wifi symbol -->
    <g fill="none" stroke="#f1f5f9" stroke-width="7" stroke-linecap="round">
      <path d="M52 66 A54 54 0 0 1 128 66"/>
      <path d="M67 83 A33 33 0 0 1 113 83"/>
    </g>
    <circle cx="90" cy="104" r="7" fill="#10b981"/>
    <text x="90" y="138" text-anchor="middle" font-family="monospace" font-size="15" font-weight="bold" fill="#94a3b8">ESP32-C3</text>
  </g>

  <!-- title -->
  <text x="600" y="60" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="40" font-weight="700" fill="#f1f5f9">ESP32-C3 WebUI</text>
  <text x="600" y="355" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="22" fill="#94a3b8">لوحة تحكم ويب  •  مدير ملفات  •  إعدادات واي فاي</text>
  <rect x="470" y="372" width="260" height="4" rx="2" fill="url(#accent)"/>
</svg>
