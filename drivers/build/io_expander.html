<!doctype html><html><head><meta charset="utf-8"><style>
*{box-sizing:border-box}body{margin:0;font:14px system-ui,sans-serif;color:var(--text);background:transparent}
.g{display:grid;grid-template-columns:repeat(auto-fit,minmax(100px,1fr));gap:8px;margin-bottom:8px}
.c{background:var(--panel);border:1px solid var(--border,#8884);border-radius:10px;padding:8px 10px}
.c small{display:block;color:var(--muted);font-size:11px}.c b{font-size:20px}
canvas{width:100%;display:block;background:var(--panel);border-radius:10px;border:1px solid var(--border,#8884)}
button,select{font:inherit;padding:6px 10px;border-radius:8px;border:1px solid var(--border,#8886);background:var(--panel);color:var(--text)}
button.on{background:var(--primary);color:#fff}input[type=range]{width:100%}
.r{display:flex;gap:8px;align-items:center;margin-top:8px;flex-wrap:wrap}#er{color:#e55}
</style></head><body>
<div class="g" id="g"></div><div id="er"></div><script>
const $=id=>document.getElementById(id),AR=esp.lang!=='en',tr=(a,e)=>AR?a:e;
function fit(cv,h){const d=devicePixelRatio||1,w=cv.clientWidth||300;cv.width=w*d;cv.height=h*d;cv.style.height=h+'px';const x=cv.getContext('2d');x.setTransform(d,0,0,d,0,0);return[x,w]}
function cs(n,f){return getComputedStyle(document.documentElement).getPropertyValue(n).trim()||f}
function line(cv,ser,cols,lo,hi,h){const[x,w]=fit(cv,h);x.strokeStyle=cs('--muted','#888')+'55';for(let i=1;i<4;i++){x.beginPath();x.moveTo(0,h*i/4);x.lineTo(w,h*i/4);x.stroke()}
 ser.forEach((s,k)=>{if(s.length<2)return;x.strokeStyle=cols[k];x.lineWidth=2;x.beginPath();s.forEach((v,i)=>{const px=i*(w/(s.length-1)),py=h-4-(v-lo)/((hi-lo)||1)*(h-8);i?x.lineTo(px,py):x.moveTo(px,py)});x.stroke()})}
function push(a,v,n){a.push(v);if(a.length>(n||60))a.shift()}
esp.on('err',m=>{$('er').textContent=m||''});
for(let i=0;i<8;i++){const b=document.createElement('button');b.id='b'+i;b.textContent='P'+i;b.onclick=()=>esp.send('tog',i);$('g').appendChild(b)}
esp.on('st',v=>{for(let i=0;i<8;i++)$('b'+i).className=(v>>i)&1?'on':''});</script></body></html>
