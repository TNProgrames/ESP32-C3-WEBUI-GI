<!doctype html><html><head><meta charset="utf-8"><style>
*{box-sizing:border-box}body{margin:0;font:14px system-ui,sans-serif;color:var(--text);background:transparent}
.g{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:8px;margin-bottom:8px}
.c{background:var(--panel);border:1px solid var(--border,#8884);border-radius:10px;padding:8px 10px}
.c small{display:block;color:var(--muted);font-size:11px}.c b{font-size:22px}
canvas{width:100%;display:block;background:var(--panel);border-radius:10px;border:1px solid var(--border,#8884)}
button,select{font:inherit;padding:5px 10px;border-radius:8px;border:1px solid var(--border,#8886);background:var(--panel);color:var(--text)}
.r{display:flex;gap:8px;align-items:center;margin-top:8px;flex-wrap:wrap}
</style></head><body><canvas id="cv"></canvas>
<div class="g" style="margin-top:8px"><div class="c"><small id="ll"></small><b id="vl">--</b></div><div class="c"><small id="lmn"></small><b id="mn">--</b></div><div class="c"><small id="lmx"></small><b id="mx">--</b></div></div>
<div class="r"><button id="rs"></button><span id="er" style="color:#e55"></span></div><script>
const $=id=>document.getElementById(id), AR=esp.lang!=='en';
const tr=(a,e)=>AR?a:e;
function fit(cv,h){const d=devicePixelRatio||1,w=cv.clientWidth||300;cv.width=w*d;cv.height=h*d;cv.style.height=h+'px';const x=cv.getContext('2d');x.setTransform(d,0,0,d,0,0);return[x,w,h]}
function cs(n,f){return getComputedStyle(document.documentElement).getPropertyValue(n).trim()||f}
function line(cv,series,cols,lo,hi,h){const[x,w]=fit(cv,h||120);x.clearRect(0,0,w,h||120);x.strokeStyle=cs('--muted','#888')+'55';x.lineWidth=1;
 for(let i=1;i<4;i++){const y=(h||120)*i/4;x.beginPath();x.moveTo(0,y);x.lineTo(w,y);x.stroke()}
 series.forEach((s,k)=>{if(s.length<2)return;x.strokeStyle=cols[k];x.lineWidth=2;x.beginPath();
  s.forEach((v,i)=>{const px=i*(w/(s.length-1)),py=(h||120)-4-(v-lo)/((hi-lo)||1)*((h||120)-8);i?x.lineTo(px,py):x.moveTo(px,py)});x.stroke()})}

$('lmn').textContent=tr('الأدنى lx','Min lx');$('lmx').textContent=tr('الأعلى lx','Max lx');$('rs').textContent=tr('تصفير','Reset');
let mn=1e9,mx=0,cur=0;
const lv=[[1,'ظلام','Dark'],[50,'خافت','Dim'],[300,'إضاءة داخلية','Indoor'],[1000,'ساطع','Bright'],[1e9,'شمس مباشرة','Sunlight']];
function arc(){const[x,w,h]=fit($('cv'),150),cx=w/2,cy=h-14,r=Math.min(cx-12,h-26);const f=Math.max(0,Math.min(1,Math.log10(Math.max(cur,1))/Math.log10(65535)));
 x.clearRect(0,0,w,h);x.lineWidth=14;x.lineCap='round';x.strokeStyle=cs('--muted','#888')+'44';x.beginPath();x.arc(cx,cy,r,Math.PI,2*Math.PI);x.stroke();
 x.strokeStyle=cs('--primary','#38bdf8');x.beginPath();x.arc(cx,cy,r,Math.PI,Math.PI+f*Math.PI);x.stroke();
 x.fillStyle=cs('--text','#fff');x.textAlign='center';x.font='bold 22px system-ui';x.fillText(cur.toFixed(1)+' lx',cx,cy-r/3);
 const l=lv.find(a=>cur<a[0]);x.font='13px system-ui';x.fillStyle=cs('--muted','#aaa');x.fillText(AR?l[1]:l[2],cx,cy-r/3+20)}
esp.on('lux',v=>{cur=v;$('vl').textContent=v.toFixed(1);if(v<mn)mn=v;if(v>mx)mx=v;$('mn').textContent=mn.toFixed(1);$('mx').textContent=mx.toFixed(1);$('er').textContent='';arc()});
esp.on('err',e=>$('er').textContent='⚠ '+e);
$('rs').onclick=()=>{mn=1e9;mx=0;$('mn').textContent=$('mx').textContent='--'};
$('ll').textContent=tr('الآن lx','Now lx');addEventListener('resize',arc);arc();
esp.height(300);</script></body></html>
