name: Build & Release

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
            ~/.platformio/.cache
          key: pio-${{ hashFiles('platformio.ini') }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build Svelte UI (to data/app, gzipped)
        run: |
          cd ui
          npm install
          npm run build

      - name: Install driver build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y clang lld
          pip install platformio cryptography

      # الدرايفرات في drivers/apps (التي يجلبها متجر الواجهة)؛ إن لم تكن مودعة في المستودع تُبنى تلقائياً قبل التحقق
      - name: Verify drivers and store logic
        run: |
          if [ ! -f drivers/apps/index.json ]; then
            python3 tools/drv/build_index.py --version 1.0
          fi
          python3 tools/drv/test_drivers.py drivers/apps
          g++ -std=gnu++17 -O2 -Isrc tools/drv/test_vm.cpp src/drv_vm.cpp -o /tmp/test_vm
          /tmp/test_vm drivers/apps/*.drv
          node tools/drv/test_store.mjs

      - name: Build, sign and test drivers from source
        run: |
          DRV_VER="${GITHUB_REF_NAME#v}"
          [[ "$GITHUB_REF" == refs/tags/v* ]] || DRV_VER="1.0"
          python3 tools/drv/build_index.py --version "$DRV_VER" --out-dir dist-drivers
          python3 tools/drv/test_drivers.py dist-drivers
          g++ -std=gnu++17 -O2 -Isrc tools/drv/test_vm.cpp src/drv_vm.cpp -o /tmp/test_vm
          /tmp/test_vm dist-drivers/*.drv

      # نفس FW_VERSION لكل خطوات pio، وإلا يعتبره PlatformIO تغيّراً في الإعدادات ويمسح مجلد البناء
      - name: Set firmware version
        run: |
          VER="$GITHUB_REF_NAME"
          [[ "$GITHUB_REF" == refs/tags/v* ]] || VER="dev-${GITHUB_SHA::7}"
          echo "PLATFORMIO_BUILD_FLAGS=-DFW_VERSION=\\\"$VER\\\"" >> "$GITHUB_ENV"

      - name: Generate gzipped emergency pages (web/*.html -> src/em.h)
        run: python3 tools/gen_em.py

      - name: Build firmware
        run: pio run

      - name: Build LittleFS image (only if data/ exists)
        run: |
          if [ -d data ]; then pio run -t buildfs; fi

      - name: Package
        run: |
          VER="${GITHUB_REF_NAME//\//-}"
          B=.pio/build/esp32-c3-devkitm-1
          rm -rf pkg && mkdir -p pkg/firmware pkg/drivers pkg/apps pkg/tools release art

          # 1) الفيرموير: ملفات الفلاش
          cp $B/firmware.bin $B/bootloader.bin $B/partitions.bin pkg/firmware/
          [ -f $B/littlefs.bin ] && cp $B/littlefs.bin pkg/firmware/ || true
          (cd pkg/firmware && zip -qr ../../release/firmware-$VER.zip .)

          # 2) الدرايفرات الموقّعة + الفهرس
          cp dist-drivers/*.drv dist-drivers/index.json pkg/drivers/
          (cd pkg/drivers && zip -qr ../../release/drivers-$VER.zip .)

          # 3) التطبيقات: سكريبت Lua + صفحة HTML + وصف
          cp dist-drivers/*.lua dist-drivers/*.html pkg/apps/ 2>/dev/null || true
          for f in drivers/apps/*.json; do [ "$(basename "$f")" = "index.json" ] || cp "$f" pkg/apps/; done
          (cd pkg/apps && zip -qr ../../release/apps-$VER.zip .)

          # 4) أدوات التطوير: بناء/توقيع/اختبار الدرايفرات + مصادرها + الوثائق
          mkdir -p pkg/tools/src pkg/tools/docs pkg/tools/apps
          cp -r tools/drv pkg/tools/drv
          cp -r drivers pkg/tools/drivers && rm -rf pkg/tools/drivers/build pkg/tools/drivers/apps
          cp src/drv_api.h src/drv_vm.h src/drv_vm.cpp pkg/tools/src/
          cp docs/ARCHITECTURE.md pkg/tools/docs/ 2>/dev/null || true
          cp docs/scripting/drivers.md docs/scripting/ui.md pkg/tools/docs/
          cp drivers/apps/*.lua drivers/apps/*.html pkg/tools/apps/ 2>/dev/null || true
          for f in drivers/apps/*.json; do [ "$(basename "$f")" = "index.json" ] || cp "$f" pkg/tools/apps/; done
          find pkg/tools -name __pycache__ -prune -exec rm -rf {} +
          (cd pkg/tools && zip -qr ../../release/tools-$VER.zip .)

          # 5) الكود المصدري الكامل
          git archive --format=zip --prefix=esp32-c3-webui-$VER/ -o release/source-$VER.zip HEAD

          # ملف .bin وحده للتحديث عن بُعد (OTA) من الواجهة
          cp $B/firmware.bin release/firmware-$VER.bin
          ls -l release

          # وضع الملفات مباشرةً داخل art/ (الفيرموير + باقي المجلدات بدون أرشيفات مدمجة)
          cp -r pkg/firmware art/firmware
          cp -r pkg/drivers pkg/apps pkg/tools art/
          ls -la art

      - uses: actions/upload-artifact@v4
        with:
          name: firmware
          path: art/

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true
