; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:esp32-c3-devkitm-1]
; pioarduino: Arduino-ESP32 3.x فوق ESP-IDF 5.x (يسمح بتعطيل حماية الذاكرة عبر sdkconfig.defaults)
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = esp32-c3-devkitm-1
framework = arduino, espidf
monitor_speed = 115200

; تحديد نظام الملفات لاستخدامه في البناء (اختياري لكن مفضل ليعرف PIO أنك تستخدم LittleFS)
board_build.filesystem = littlefs

; جدول أقسام مخصص: تطبيق أكبر (1.6MB) لاستيعاب محرك Lua
board_build.partitions = partitions.csv

lib_compat_mode = strict
lib_ldf_mode = chain

lib_deps =
    ; مكتبة JSON الإصدار 7
    bblanchon/ArduinoJson @ ^7.0.0

    ; مكتبة السيرفر غير المتزامن (النسخة المحدثة والمستقرة حالياً)
    mathieucarbou/ESPAsyncWebServer @ 3.6.0

    ; مكتبة TCP الأساسية (مطلوبة للسيرفر)
    mathieucarbou/AsyncTCP @ 3.3.2
